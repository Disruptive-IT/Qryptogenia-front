# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: QRyptogenia FRONT CI/CD (Deploy)

on:
  push:
    branches: [ "production" ]

jobs:
  build:

    #runs-on: ubuntu-latest
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [20.x]
        #node-version: [14.x, 16.x, 18.x, 20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies (run npm install)
      run: |
        npm install

    - name: Copiar archivo de variables de entorno
      run: |
        cp -r /home/mesadokoapi/env_variables/.env_qryptogenia_front /home/QRyptogenia/FRONT/actions-runner/Qryptogenia-front/Qryptogenia-front/Qryptogenia-front.env

    - name: Build the website (ReactJS) (run npm build)
      run: |
        npm run build

    #- run: npm run dev
    #- run: npm run build --if-present
    #- run: npm test